###############################################
# VAM Inference Container
#
# Usage:
#   cd docker
#   docker compose up -d
#   docker exec -it rapp_vam bash
###############################################

name: rapp-vam

services:
  vam:
    build:
      context: ./vam
      dockerfile: Dockerfile
    container_name: rapp_vam
    hostname: vam-container

    runtime: nvidia
    network_mode: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CUDA_VISIBLE_DEVICES=0
      - QT_X11_NO_MITSHM=1
      - RCUTILS_COLORIZED_OUTPUT=1
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8

    entrypoint: /entrypoint_vam.sh
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]

    volumes:
      # Custom entrypoint (mounted so changes apply without rebuild)
      - ./vam/entrypoint.sh:/entrypoint_vam.sh:ro

      # Code directories (development mode — editable)
      - ../vam_utils:/workspace/vam_utils:rw
      - ../notebooks_ur:/workspace/notebooks_ur:rw
      - ../notebooks_tm:/workspace/notebooks_tm:rw
      - ../ros2_ws:/workspace/ros2_ws:rw
      - ../scripts:/workspace/scripts:rw

      # Configuration
      - ../config:/config:ro

      # Data volumes — one host root, set ENACT_DATA in docker/.env
      # (defaults to ~/enact_local; see .env.example)
      - ${ENACT_DATA:-${HOME}/enact_local}/rosbags:/data/rosbags:rw
      - ${ENACT_DATA:-${HOME}/enact_local}/csvdata:/data/processed:rw
      - ${ENACT_DATA:-${HOME}/enact_local}/models:/data/models:rw
      - ${ENACT_DATA:-${HOME}/enact_local}/logs:/data/logs:rw

      # X11 for GUI (matplotlib, etc.)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:rw

      # GPU device files
      - /dev/dri:/dev/dri:rw

    privileged: true
    devices:
      - /dev:/dev

    stdin_open: true
    tty: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    shm_size: '8gb'
    restart: unless-stopped
