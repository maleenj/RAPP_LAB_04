###############################################
# MoveIt Servo config for VAM inference on TM12S
#
# Based on ur_servo_vam.yaml, adapted for TM12S:
#   - move_group_name: tmr_arm
#   - planning_frame: base
#   - ee_frame: flange
#   - command_out_topic: /forward_position_controller/commands
#
# This config requires a ForwardCommandController loaded for TM12S.
# If not available, use tm12s_servo_vam_traj.yaml instead.
###############################################
servo_node:
  ros__parameters:
    use_gazebo: false

    ## Properties of incoming commands
    command_in_type: "speed_units" # JointJog velocities in rad/s
    scale:
      linear:  0.6
      rotational:  0.3
      joint: 0.01

    system_latency_compensation: 0.04

    ## Properties of outgoing commands
    publish_period: 0.004  # 250 Hz
    low_latency_mode: false

    command_out_type: std_msgs/Float64MultiArray

    publish_joint_positions: true
    publish_joint_velocities: false
    publish_joint_accelerations: false

    ## Smoothing filter
    smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

    is_primary_planning_scene_monitor: false

    ## Incoming Joint State filtering (2.0 = responsive, less smoothing)
    low_pass_filter_coeff: 2.0

    ## MoveIt properties
    move_group_name: tmr_arm
    planning_frame: base

    ## Other frames
    ee_frame_name: flange
    robot_link_command_frame: flange

    ## Stopping behaviour
    incoming_command_timeout: 0.1
    num_outgoing_halt_msgs_to_publish: 4

    ## Singularity and joint limits
    lower_singularity_threshold: 100.0
    hard_stop_singularity_threshold: 200.0
    joint_limit_margin: 0.1  # [radians]

    ## Topic names
    cartesian_command_in_topic: ~/delta_twist_cmds
    joint_command_in_topic: ~/delta_joint_cmds
    joint_topic: /joint_states
    status_topic: ~/status
    command_out_topic: /forward_position_controller/commands

    ## Collision checking
    check_collisions: true
    collision_check_rate: 5.0
    collision_check_type: threshold_distance
    self_collision_proximity_threshold: 0.01
    scene_collision_proximity_threshold: 0.02
    collision_distance_safety_factor: 1000.0
    min_allowable_collision_distance: 0.01
