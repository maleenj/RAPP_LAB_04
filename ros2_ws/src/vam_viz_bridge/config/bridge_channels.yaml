# vam_viz_bridge channel map
# ---------------------------
# Each entry under `channels` taps one ROS2 topic and re-publishes it to all
# connected WebSocket clients under the given `channel` name.
#
# To add a new data source: add ONE entry below. No code change is needed for any
# topic whose message type is already supported (JointState, Float32/64MultiArray,
# zed ObjectsStamped). A genuinely new message type needs one serializer function
# in serializers.py.
#
# Optional keys per channel:
#   serializer:  override the auto-picked serializer (e.g. "multiarray_named")
#   qos:         "default" (reliable) | "sensor" (best-effort, for high-rate data)

server:
  websocket:
    enabled: true
    host: "0.0.0.0"   # bind all interfaces; clients connect to ws://<host-ip>:8765
    port: 8765

channels:
  # The robot's ACTUAL measured joint positions — what the arm is physically
  # doing. This is the one joint channel to drive visuals synced to the robot.
  # (The VAM's predicted /vam/joint_states and commanded /vam/joint_targets are
  # intentionally NOT streamed — they aren't the physical state. Those ROS topics
  # still exist for the robot pipeline; we just don't fan them out to clients.)
  - topic: "/joint_states"
    type: "sensor_msgs/msg/JointState"
    channel: "robot_joint_states"

  # --- Phase 2: NN internal activations (the "brain scan"). Streamed when the
  #     viz inference node runs (vam_tm12s_node_viz / vam_tm12s_robot_viz.launch.py).
  #     Harmless if no one publishes /vam/activations — the channel just stays idle. ---
  - topic: "/vam/activations"
    type: "std_msgs/msg/Float32MultiArray"
    channel: "activations"
    serializer: "multiarray_named"

  # --- Human skeleton keypoints [K,3] ---
  # Fed by `ros2 run vam_inference skeleton_relay` (which converts the ZED
  # ObjectsStamped into this generic Float32MultiArray, so the lightweight bridge
  # needs no zed_msgs). Run the relay in a container that has zed_msgs (rapp_vam).
  - topic: "/vam/skeleton"
    type: "std_msgs/msg/Float32MultiArray"
    channel: "skeleton"

# Derived explainability metrics — computed in THIS (viz) container from the raw
# activations, then broadcast as their own channels. Add/tweak freely and restart
# only rapp_viz; the inference node is never touched.
derived:
  - from: activations
    transform: attention_entropy
    channel: attn_entropy
  - from: activations
    transform: activation_norm
    channel: activation_energy
